[project]
name = "indigo-home-connect"
version = "2026.0.1"
description = "Indigo plugin for Bosch/Siemens Home Connect appliances"
requires-python = ">=3.10"

[tool.pylint.main]
py-version = "3.10"
fail-under = 9.0
jobs = 0
ignore-paths = ["tests", "__pycache__"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-attributes = 20
max-args = 8

[tool.pylint."messages control"]
disable = [
    "too-many-public-methods",  # Plugin class requires many callbacks for Indigo API
    "invalid-name",             # Indigo uses camelCase callbacks
]

[tool.pylint.basic]
method-rgx = "[a-z_][a-zA-Z0-9_]{2,}$"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
